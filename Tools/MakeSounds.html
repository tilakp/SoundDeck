<!doctype html>
<meta charset="utf-8">
<title>Make Sounds</title>
<!--
  This page renders the bundled sounds. Tools/MakeSounds.mjs opens it in headless Chrome.
  The synthesis is a copy of the Sound Deck demo on quietpixel.dev (public/app.js).
  Keep the functions tone, hiss, bell and SOUNDS the same as the web demo.
  The page gives each sound as a base64 WAV file.
-->
<script>
// A seeded generator replaces Math.random. Thus each render gives the same files.
let seed = 0;
Math.random = () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

const RATE = 44100;
const TAIL = 0.25; // Seconds of silence after the length that each sound gives.
// One gain for all sounds sets the highest peak to -1 dBFS.
// The levels of the sounds stay the same relative to each other, as in the web demo.
const PEAK = Math.pow(10, -1 / 20);
let ac, noise;

// ---- Start of the copy from the web demo. ----
const tone = (out, { type = "sine", f, f2, t = 0, a = 0.005, d, v = 0.5 }) => {
  const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
  o.type = type;
  o.frequency.setValueAtTime(f, s);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
  g.gain.setValueAtTime(0, s);
  g.gain.linearRampToValueAtTime(v, s + a);
  g.gain.exponentialRampToValueAtTime(0.0001, s + d);
  o.connect(g).connect(out);
  o.start(s);
  o.stop(s + d + 0.05);
  return o;
};
const hiss = (out, { t = 0, d, v = 0.4, type = "highpass", f = 5000, q = 0.7 }) => {
  const n = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain(), s = ac.currentTime + t;
  n.buffer = noise;
  flt.type = type;
  flt.frequency.value = f;
  flt.Q.value = q;
  g.gain.setValueAtTime(v, s);
  g.gain.exponentialRampToValueAtTime(0.0001, s + d);
  n.connect(flt).connect(g).connect(out);
  n.start(s, Math.random());
  n.stop(s + d + 0.05);
};
const bell = (out, f, t, d, v) => [1, 2.76, 5.4].forEach((r, i) => tone(out, { f: f * r, t, d: d / (i + 1), v: v / (i + 1.5) }));

const SOUNDS = {
  drum(out) {
    for (const t of [0, 0.16]) tone(out, { f: 160, f2: 45, t, d: 0.25, v: 0.9 });
    hiss(out, { t: 0.34, d: 0.18, v: 0.5, type: "bandpass", f: 1800, q: 0.8 });
    tone(out, { type: "triangle", f: 220, f2: 150, t: 0.34, d: 0.12, v: 0.3 });
    hiss(out, { t: 0.52, d: 1.3, v: 0.25, f: 7000 });
    return 1.9;
  },
  laser(out) {
    for (const t of [0, 0.22]) tone(out, { type: "square", f: 1700, f2: 140, t, d: 0.32, v: 0.18 });
    return 0.6;
  },
  glass(out) {
    hiss(out, { d: 0.25, v: 0.6, type: "bandpass", f: 4200, q: 1.2 });
    [2600, 3950, 5200, 6100, 3300].forEach((f, i) => tone(out, { f, t: i * 0.035 + Math.random() * 0.03, d: 0.5 + Math.random() * 0.4, v: 0.12 }));
    return 1.1;
  },
  chime(out) {
    [1318.5, 1046.5, 784].forEach((f, i) => bell(out, f, i * 0.28, 1.6, 0.35));
    return 2.3;
  },
  bike(out) {
    for (const t of [0, 0.17]) { tone(out, { f: 2350, t, d: 0.45, v: 0.3 }); tone(out, { f: 2950, t, d: 0.3, v: 0.15 }); }
    return 0.7;
  },
  whistle(out) {
    const o = tone(out, { f: 2100, f2: 750, d: 1.2, a: 0.05, v: 0.25 });
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 7;
    depth.gain.value = 40;
    lfo.connect(depth).connect(o.frequency);
    lfo.start();
    lfo.stop(ac.currentTime + 1.3);
    return 1.3;
  },
  gong(out) {
    [110, 163, 231, 287, 344, 456].forEach((f, i) => tone(out, { f: f * (1 + Math.random() * 0.004), a: 0.02, d: 4.2 - i * 0.4, v: 0.32 / (i + 1) }));
    hiss(out, { d: 0.12, v: 0.2, type: "lowpass", f: 900 });
    return 4.2;
  },
  trombone(out) {
    const flt = ac.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.value = 1300;
    flt.connect(out);
    [[392, 0, 0.42], [370, 0.45, 0.42], [349, 0.9, 0.42], [330, 1.35, 1.3]].forEach(([f, t, d], i) => {
      const o = tone(flt, { type: "sawtooth", f, t, d, a: 0.04, v: 0.22 });
      if (i === 3) {
        const lfo = ac.createOscillator(), depth = ac.createGain();
        lfo.frequency.value = 5.5;
        depth.gain.value = 9;
        lfo.connect(depth).connect(o.frequency);
        lfo.start(ac.currentTime + t);
        lfo.stop(ac.currentTime + t + d);
      }
    });
    return 2.7;
  },
  applause(out) {
    for (let i = 0; i < 140; i++) {
      const t = Math.random() * 2.4;
      hiss(out, { t, d: 0.03 + Math.random() * 0.04, v: 0.35 * (1 - t / 3), type: "bandpass", f: 1500 + Math.random() * 2500, q: 1.5 });
    }
    return 2.6;
  },
};
// ---- End of the copy from the web demo. ----

// The file names and the pad order. The order is the same as the web demo.
const FILES = [
  ["drum", "Ba-dum-tss"], ["laser", "Laser"], ["glass", "Glass"],
  ["chime", "Chime"], ["bike", "Bike bell"], ["whistle", "Whistle"],
  ["gong", "Gong"], ["trombone", "Sad trombone"], ["applause", "Applause"],
];

// Renders one sound. The graph is the same as the web demo: voice gain, then master gain 0.7.
async function render(key) {
  seed = 1;
  ac = new OfflineAudioContext(1, RATE * 6, RATE);
  noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const master = ac.createGain();
  master.gain.value = 0.7;
  master.connect(ac.destination);
  const out = ac.createGain();
  out.connect(master);
  const length = SOUNDS[key](out);
  const full = (await ac.startRendering()).getChannelData(0);
  const samples = full.slice(0, Math.round((length + TAIL) * RATE));
  const lost = full.slice(samples.length).reduce((m, x) => Math.max(m, Math.abs(x)), 0);
  const peak = samples.reduce((m, x) => Math.max(m, Math.abs(x)), 0);
  return { samples, peak, lost };
}

// Applies the gain, and a 10 ms fade at the end that prevents a click.
function finish(samples, gain) {
  const fade = Math.round(0.01 * RATE);
  for (let i = 0; i < samples.length; i++) {
    samples[i] *= gain * Math.min(1, (samples.length - 1 - i) / fade);
  }
  return samples;
}

// Encodes 16-bit mono PCM WAV.
function wav(samples) {
  const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const text = (at, s) => [...s].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
  text(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); text(8, "WAVE");
  text(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, RATE, true); view.setUint32(28, RATE * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, "data"); view.setUint32(40, samples.length * 2, true);
  samples.forEach((x, i) => view.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, x)) * 32767), true));
  let binary = "";
  new Uint8Array(view.buffer).forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}

// Tools/MakeSounds.mjs reads this promise.
window.result = (async () => {
  const sounds = [];
  for (const [key, name] of FILES) sounds.push({ name, ...(await render(key)) });
  const gain = PEAK / Math.max(...sounds.map((s) => s.peak));
  return sounds.map(({ name, samples, peak, lost }) => ({
    name: `${name}.wav`,
    info: `${(samples.length / RATE).toFixed(2)} s, peak ${(peak * gain).toFixed(3)}, cut ${lost.toExponential(1)}, gain ${gain.toFixed(3)}`,
    data: wav(finish(samples, gain)),
  }));
})();
</script>
